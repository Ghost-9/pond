name: Feature request
description: Something Pond doesn't do yet, or could do better.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Search [feature requests](https://github.com/raphaelsalaja/pond/issues?q=is%3Aissue+label%3Aenhancement) first. If yours is already there, add a 👍 to it instead of a comment.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem, not the fix. Say what you tried and where Pond got in the way.
      placeholder: I save threads from X and want to find them by author, but search only matches the text.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: How other apps handle it, sketches, or screenshots.
  - type: checkboxes
    id: terms
    attributes:
      label: Code of conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](https://github.com/raphaelsalaja/pond/blob/main/CODE_OF_CONDUCT.md).
          required: true
