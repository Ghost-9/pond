name: Bug report
description: Something in Pond is broken or doesn't behave the way you expect.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Search [existing issues](https://github.com/raphaelsalaja/pond/issues?q=is%3Aissue) first. If yours is already there, add a 👍 to it instead of a comment.

        In Pond, **Help > Report an Issue** opens this form with your environment filled in.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Start from opening Pond. Screenshots and screen recordings help.
      placeholder: |
        1. Open an image Save
        2. Crop it
        3. Press Esc
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Current vs. expected behavior
      placeholder: Esc does nothing after cropping. I expected it to return to the grid.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Filled in when you use Help > Report an Issue. Otherwise, add your Pond version from About Pond, your OS version, and your Mac or PC architecture.
      placeholder: |
        Pond: 1.1.0
        OS: macOS 15.4.0
        Architecture: arm64
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      description: Only if the browser extension is involved.
      placeholder: Chrome 141, Firefox 144, Arc
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Help > Show Logs opens the log folder. Remove anything private before you paste. Help > Export Debug Report makes a redacted file you can attach instead.
      value: |
        <details><summary>Logs</summary>

        ```log

        ```

        </details>
  - type: checkboxes
    id: terms
    attributes:
      label: Code of conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](https://github.com/raphaelsalaja/pond/blob/main/CODE_OF_CONDUCT.md).
          required: true
